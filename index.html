<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="notebooks.html" method="post">
        <h1>Login</h1>
        <input type="text" placeholder="Enter here" id="username" required>
        <br>
        <input type="password" placeholder="********" id="password" required>
        <br>
        <br><br>
        <button type="submit" class="btn btn-success w-25 mt-4" id="submitButton" value="Go to another page" onclick="login_Status()">Submit</button>
        <button type="reset" class="btn btn-danger w-25 mt-4">Clear</button>
    </form>
<div id="login"></div>
<script src="main.js"></script>
</body>
</html>
